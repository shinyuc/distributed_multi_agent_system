simulation:
  dt: 0.01
  steps: 3500
  seed: 42

agents:
  num_agents: 5
  initial_positions:
    - [-7.0, -1.0]
    - [-5.0, -1.0]
    - [-5.0, 1.0]
    - [-7.0, 1.0]
    - [-6.0, 0.0]

obstacles:
  obstacles:
    - center: [-20.0, 1.5] # [-3.0, 1.5]
      radius: 0.6
    - center: [-25.0, -1.5] # [-2.0, -1.5]
      radius: 0.5

target:
  center: [0.0, 0.0]
  radius: 1.0
  Sigma:
    - [2.0, 0.0]
    - [0.0, 0.25]
  epsilon: 0.2

controller:
  u_max: 100.0
  safety_distance: 0.35
  clf_rate: 0.01
  cbf_rate: 2.0
  nominal_gain: 1.0
  enable_connectivity_constraint: True
  alpha_connectivity: 1.0
  debug_disable_clf_coupling: False

fast_dynamics:
  tau: 0.1
  xi: 1.0
  d_c: 2.5
  eta: 0.001
  epsilon_c: 0.1
