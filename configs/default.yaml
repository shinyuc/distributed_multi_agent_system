simulation:
  dt: 0.001
  steps: 40000
  seed: 42

agents:
  num_agents: 5 #4
  initial_positions:
    # - [-10.0,  -10.0]
    # - [-10.0, 10.0]
    # - [10.0, 10.0]
    # - [10.0, -10.0]
    # - [0.0, 10.0]
    - [-10.0,  -1.0]
    - [-10.0, 1.0]
    - [-9.0, 0.0]
    - [-8.0, -1.0]
    - [-8.0, 1.0]
    # - [-10.0,  -1.0]
    # - [-10.0, 1.0]
    # - [-8.0, -1.0]
    # - [-8.0, 1.0]
    # - [-6.0,  -0.5]
    # - [-5.0, -1]
    # - [-6.0, 0.5]
    # - [-5.0, 1]
    # - [-5.0, -1.0]
    # - [-5.0, -0.4]
    # - [-5.0, 0.4]
    # - [-5.0, 1.0]

obstacles:
  obstacles:
    - center: [-5.0, 1.5] # [-3.0, 1.5] [-3.0, 1.5]
      radius: 0.6
    - center: [-2.0, -1.5] # [-2.0, -1.5]
      radius: 0.5

# target:
#   center: [0.0, 0.0]
#   radius: 1.0
#   Sigma:
#     - [1.0, 0.0]
#     - [0.0, 1.0]
#   epsilon: 0.2
target:
  center: [0.0, 0.0]
  radius: 1.0
  Sigma:
    - [2.0, 0.0]
    - [0.0, 0.25]
  epsilon: 0.3

controller:
  mode: distributed
  u_max: 20.0 # 20.0
  safety_distance: 0.3
  clf_rate: 0.02 # 0.18
  cbf_rate: 2.0
  nominal_gain: 1.0
  enable_connectivity_constraint: True
  alpha_clf: 1.0 # 1.0
  alpha_connectivity: 1.0

fast_dynamics:
  tau: 0.2 # 0.1
  xi: 0.5 # 1.0
  d_c: 100.0
  eta: 0.1
  epsilon_c: 0.1
