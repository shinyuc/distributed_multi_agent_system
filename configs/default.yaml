# target:
#   center: [0.0, 0.0]
#   radius: 1.0
#   Sigma:
#     - [1.0, 0.0]
#     - [0.0, 1.0]
#   epsilon: 0.2
target:
  center: [0.0, 0.0]
  radius: 1.0
  Sigma:
    - [2.0, 0.0]
    - [0.0, 0.25]
  epsilon: 0.5

controller:
  mode: distributed
  u_max: 20.0 # 20.0
  safety_distance: 0.3
  clf_rate: 0.025 # 0.18
  cbf_rate: 2.0
  nominal_gain: 1.0
  enable_connectivity_constraint: True
  alpha_clf: 1.0 # 1.0
  alpha_connectivity: 1.0

fast_dynamics:
  tau: 0.02 # 0.1
  xi: 0.5 # 1.0
  d_c: 0.9 # 100
  eta: 0.1
  epsilon_c: 0.1
