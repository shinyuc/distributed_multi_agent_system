simulation:
  dt: 0.001
  steps: 50
  seed: 42
agents:
  num_agents: 3
  init_mode: manual
  initial_positions:
  - - -1.0
    - 0.0
  - - -1.35
    - 0.0
  - - -1.7
    - 0.0
  init_region:
    center:
    - -2.0
    - 0.0
    Sigma:
    - - 2.0
      - 0.0
    - - 0.0
      - 0.25
    radius: 1.0
    check_manual_positions: true
    save_dir: outputs/init_conditions
    max_sampling_attempts: 2000
    max_global_restarts: 50
obstacles:
  obstacles:
  - center:
    - -0.6
    - 0.0
    radius: 0.3
target:
  center:
  - 0.0
  - 0.0
  radius: 1.0
  Sigma:
  - - 2.0
    - 0.0
  - - 0.0
    - 0.25
  epsilon: 0.5
controller:
  mode: distributed
  u_max: 20.0
  safety_distance: 0.2
  clf_rate: 1.2
  cbf_rate: 2.0
  nominal_gain: 1.0
  enable_connectivity_constraint: true
  alpha_clf: 1.0
  alpha_connectivity: 1.0
  clf_coupling: gated
fast_dynamics:
  tau: 0.02
  xi: 0.5
  d_c: 0.9
  eta: 0.1
  epsilon_c: 0.1
  substeps: 10
